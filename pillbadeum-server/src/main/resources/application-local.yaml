spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pilldb?connectionTimeZone=%2B09:00&forceConnectionTimeZoneToSession=true}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    org.hibernate.SQL: debug
    org.semiproject.pillbadeumserver: debug
