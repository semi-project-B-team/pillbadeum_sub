name: Pillbadeum server CI

on:
  push:
    paths: ['pillbadeum-server/**', '.github/workflows/pillbadeum-server-ci.yml']
  pull_request:
    paths: ['pillbadeum-server/**', '.github/workflows/pillbadeum-server-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pillbadeum-server
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pill_test
          MYSQL_USER: pill
          MYSQL_PASSWORD: pill-ci-only
          MYSQL_ROOT_PASSWORD: ci-root-only
          TZ: Asia/Seoul
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
          - 6334:6334
    env:
      MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/pill_test?connectionTimeZone=%2B09:00&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      MYSQL_TEST_USER: pill
      MYSQL_TEST_PASSWORD: pill-ci-only
      QDRANT_TEST_PORT: 6334
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Wait for Qdrant
        run: |
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:6333/readyz; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test and build
        run: ./gradlew test bootJar --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pillbadeum-server-test-reports
          path: pillbadeum-server/build/reports/tests/test
