<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>복약 알림 시험</title>
  <style>
    body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; line-height: 1.6; }
    fieldset { border: 1px solid #ccc; border-radius: 8px; margin-bottom: 16px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin: 4px 0 8px; }
    button { padding: 10px 16px; margin: 4px 4px 4px 0; cursor: pointer; }
    #log { background: #f5f5f5; border-radius: 8px; padding: 12px; white-space: pre-wrap; min-height: 80px; }
  </style>
</head>
<body>
  <h1>복약 알림 시험</h1>
  <p>로컬 개발용 화면입니다. 크롬에서 열고, 브라우저 알림 허용 창이 뜨면 '허용'을 눌러주세요.</p>

  <fieldset>
    <legend>1. 로그인</legend>
    <label>이메일 <input id="email" type="email" autocomplete="username"></label>
    <label>비밀번호 <input id="password" type="password" autocomplete="current-password"></label>
    <button id="login">로그인</button>
    <label>또는 토큰 직접 붙여넣기 <input id="token" placeholder="eyJ..."></label>
  </fieldset>

  <fieldset>
    <legend>2. 이 브라우저로 알림 받기</legend>
    <button id="enable">알림 켜기 (허용 → 구독 저장 → 켜기)</button>
  </fieldset>

  <fieldset>
    <legend>3. 시험 알림</legend>
    <button id="send">시험 알림 보내기</button>
    <p>알림이 오면 화면 오른쪽 아래에 뜹니다. 이 탭을 닫아도 크롬이 켜져 있으면 옵니다.</p>
  </fieldset>

  <div id="log">대기 중</div>
  <script src="/dev/push-test.js"></script>
</body>
</html>
