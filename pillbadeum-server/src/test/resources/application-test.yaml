spring:
  datasource:
    url: ${MYSQL_TEST_URL:jdbc:mysql://127.0.0.1:3307/pill_test}
    username: ${MYSQL_TEST_USER:pill}
    password: ${MYSQL_TEST_PASSWORD:}
  main:
    keep-alive: false

# 공개된 테스트 전용 키이며 실제 실행/배포에서는 사용하지 않습니다.
jwt:
  secret: cGlsbGJhZGV1bS10ZXN0LW9ubHktc2lnbmluZy1rZXktMzItYnl0ZXM

# 테스트 DB에 매분 발송 시각 행이 생기지 않도록 복약 알림 스케줄러를 끈다. 실제 키도 넣지 않는다.
web-push:
  scheduler:
    enabled: false
  vapid:
    public-key: ""
    private-key: ""
    subject: ""

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

photo:
  cleanup:
    enabled: false

pill-identification:
  catalog-refresh-enabled: false
  catalog-file: ${java.io.tmpdir}/pill-catalog-tests-${random.uuid}.json
